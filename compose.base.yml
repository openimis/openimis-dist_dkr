x-api: &default-api
  image: ghcr.io/openimis/openimis-be:${BE_TAG:-develop}
  environment:
    - DB_DEFAULT=${DB_DEFAULT:-postgresql}
    - DB_HOST=${DB_HOST}
    - DB_PORT=${DB_PORT}
    - DB_NAME=${DB_NAME}
    - DB_USER=${DB_USER}
    - DB_PASSWORD=${DB_PASSWORD}
    - SECRET_KEY=${SECRET_KEY}
    - SITE_ROOT=api
    - SITE_URL=${DOMAIN}
    - CELERY_BROKER_URL=amqp://rabbitmq
    - MODE=${MODE:-Prod}
    - HOSTS=${HOSTS}
    - CACHE_BACKEND=${CACHE_BACKEND}
    - CACHE_URL=${CACHE_URL}
    - CACHE_OPTIONS=${CACHE_OPTIONS}
    - OPENSEARCH_ADMIN=${OPENSEARCH_ADMIN}
    - OPENSEARCH_PASSWORD=${OPENSEARCH_PASSWORD}
    - OPENSEARCH_HOSTS=${OPENSEARCH_HOSTS}
    # The cluster CA opensearch-certgen writes. Read only for an https
    # OPENSEARCH_HOSTS; ignored for http and by images that predate it.
    - OPENSEARCH_CA_CERTS=/run/opensearch-ca/ca.pem
  volumes:
    - photos:/openimis-be/openIMIS/images/insurees
    - ./data/opensearch/ca:/run/opensearch-ca:ro
  depends_on:
    db:
      condition: service_healthy
  networks:
    openimis-net:
    # The node, and nothing else of OpenSearch: not Dashboards, which relays
    # identity headers to the cluster from the one address it trusts.
    search-net:

services:
  frontend:
    image: ghcr.io/openimis/openimis-fe:${FE_TAG:-develop}
    restart: always
    environment:
      - REACT_APP_SENTRY_DSN=${REACT_APP_SENTRY_DSN}
      - REACT_APP_API_URL=api
      - NEW_OPENIMIS_HOST=${DOMAIN}
      - OPENIMIS_CONF_JSON=${OPENIMIS_FE_CONF_JSON}
    networks:
      openimis-net:
      # The only way to Dashboards, so every request to it passes the gate.
      dashboards-net:
      # proxy:
    ports:
      - ${HTTP_PORT:-80}:80
      - ${HTTPS_PORT:-443}:443
    depends_on:
      - backend
    volumes:
      - ./data/certbot/conf:/etc/letsencrypt
      - ./data/certbot/www:/var/www/certbot
      # comment the following line if you are using your own gateway
      - ./conf/nginx:/conf/
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=proxy"
      - "traefik.http.routers.frontend.entrypoints=websecure"
      - "traefik.http.routers.frontend.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend.tls=true"
      - "traefik.http.routers.frontend.tls.certresolver=letsencrypt"
      - "traefik.http.services.frontend.loadbalancer.server.port=80"
      # Optional: Redirect HTTP to HTTPS
      - "traefik.http.routers.frontend-http.entrypoints=web"
      - "traefik.http.routers.frontend-http.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.frontend-http.middlewares=redirect-to-https"
      - "traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https"

  migrations:
    <<: *default-api
    command: init
    restart: no
    depends_on:
      # A service-level depends_on replaces the anchor's rather than merging
      # with it, so the database condition is repeated here on purpose.
      db:
        condition: service_healthy
      opensearch-certgen:
        condition: service_completed_successfully
  backend:
    <<: *default-api
    command: start
    restart: always
    depends_on:
      migrations:
        condition: service_completed_successfully   
      redis:
        condition: service_healthy
  worker:
    <<: *default-api
    command: worker --concurrency=${CELERY_CONCURRENCY:-4} --max-tasks-per-child=${CELERY_MAX_TASK_PER_CHILD:-50} --loglevel=INFO
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "celery -A openIMIS inspect ping --timeout=10 --destination celery@$$HOSTNAME || exit 1"]
      interval: 25s
      timeout: 12s
      retries: 4
      start_period: 40s
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      mode: replicated
      replicas: ${WORKER_REPLICAS:-3}   # default 3; increase via WORKER_REPLICAS if needed
  rabbitmq:
    image: rabbitmq:3-management
    restart: always
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      openimis-net:
networks:
  # proxy:
  #   external: true
  openimis-net:
    name: "${PROJECT_NAME:-openimis}-net"
  # OpenSearch is split over three networks so that no container can hand
  # Dashboards a forged identity: Dashboards relays x-proxy-* headers from its
  # own address, which the cluster trusts. Defined here beside openimis-net
  # because that is where this file keeps networks. Note that
  # compose.openSearch.yml is required either way: migrations depends on
  # opensearch-certgen, which lives there.
  #
  # nginx -> Dashboards: frontend and Dashboards only.
  dashboards-net:
    name: "${PROJECT_NAME:-openimis}-dashboards-net"
  # The indexer -> the node: the api containers and the node. An address here
  # is never trusted for identity headers.
  search-net:
    name: "${PROJECT_NAME:-openimis}-search-net"
  # Dashboards -> the node, from the fixed address the cluster trusts identity
  # headers from. Only the node, Dashboards and opensearch-config join it.
  opensearch-net:
    name: "${PROJECT_NAME:-openimis}-opensearch-net"
    ipam:
      config:
        - subnet: ${OPENSEARCH_NET_SUBNET:-172.29.0.0/24}
volumes:
  database:
  photos:
