---
_meta:
  type: "rolesmapping"
  config_version: 2
# The internal users (admin, openimis_indexer, dashboards_server) get their
# roles in internal_users.yml, which configure.sh writes. No mapping here names
# a user: a proxy-authenticated openIMIS login with the same name would match.
# Right 199001 (view dashboards), as forwarded in x-proxy-rights. kibana_user
# also lets the holder edit saved objects, which is a known and accepted gap:
# the gate cannot tell a reading request from a writing one.
kibana_user:
  reserved: false
  backend_roles: ["199001"]
readall:
  reserved: false
  backend_roles: ["199001"]
  description: "Read every index. Coarse on purpose; per-index roles come later"
