name: CI pipeline

on:
  push:
    branches:
      - main
      - 'release/**'
      - develop
      - 'feature/**'
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      comment:
        description: "Purpose of the manual run:"
        required: false
        type: string
      be_tag:
        description: "Backend tag/branch (BE_TAG)"
        required: false
        type: string
        default: develop
      fe_tag:
        description: "Frontend tag/branch (FE_TAG)"
        required: false
        type: string
        default: develop

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@1a6d90ebcb0e6a6b1d87e37ba693fe453195ae25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    name: Cypress
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup environment
        run: |
          cp .env.example .env
          sed -i.bak '/^DEMO_DATASET=/d;/^BE_TAG=/d;/^FE_TAG=/d;/^SECRET_KEY=/d' .env
          rm -f .env.bak

          echo 'SECRET_KEY=cypressci' >> .env
          echo 'DEMO_DATASET=true' >> .env
          echo 'DB_TAG=25.04' >> .env

          # Use workflow_dispatch inputs if provided, otherwise default to 'develop'
          BE_TAG="${{ inputs.be_tag || 'develop' }}"
          FE_TAG="${{ inputs.fe_tag || 'develop' }}"

          echo "BE_TAG=$BE_TAG" >> .env
          echo "FE_TAG=$FE_TAG" >> .env

          echo 'DOMAIN=localhost' >> .env
          echo 'HOSTS=localhost' >> .env

          cp .env.openSearch.example .env.openSearch
          # The example enables the security plugin, which needs a backend image
          # carrying OPENSEARCH_CA_CERTS to verify the cluster certificate. Until
          # a develop image has it, CI runs the cluster in legacy mode: drop these
          # three substitutions when it does.
          sed -i 's|^OPENSEARCH_SECURITY_DISABLED=.*|OPENSEARCH_SECURITY_DISABLED=true|;s|^OPENSEARCH_HOSTS=.*|OPENSEARCH_HOSTS=http://opensearch:9200|;s|^OPENSEARCH_DASHBOARDS_HOSTS=.*|OPENSEARCH_DASHBOARDS_HOSTS=["http://opensearch:9200"]|' .env.openSearch
          # Substituted rather than appended: whether a repeated key wins in an
          # env file is exactly the subtlety .env.example warns about.
          for v in OPENSEARCH_SUPERUSER_PASSWORD OPENSEARCH_PASSWORD OPENSEARCH_DASHBOARDS_PASSWORD OPENSEARCH_DASHBOARDS_COOKIE_PASSWORD; do
            sed -i "s|^$v=.*|$v=ci-only-$(openssl rand -hex 16)|" .env.openSearch
          done

          docker compose up -d

          echo "Waiting for 'Starting Django...' in backend logs..."
          BACKEND_CONTAINER=$(docker compose ps -q backend)
          for i in {1..30}; do
            if docker logs $BACKEND_CONTAINER 2>&1 | grep -q "Starting Django..."; then
              echo "Server is ready"
              exit 0
            fi
            echo "Not ready yet... retry $i/30"
            docker logs --tail 50 $BACKEND_CONTAINER || true
            sleep 10
          done
          echo "Server did not start in 5 minutes"
          docker logs $BACKEND_CONTAINER || true
          exit 1

      - name: Cypress run
        uses: cypress-io/github-action@b8ba51a856ba5f4c15cf39007636d4ab04f23e3c
        with:
          record: false
          parallel: false
          wait-on: 'http://localhost/front/'
        env:
          CYPRESS_RECORD_KEY: ${{ secrets.CYPRESS_RECORD_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots/**
            cypress/videos/**
            cypress/reports/**
